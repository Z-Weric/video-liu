<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.png" type="image/png">
<title>刘晓菊 | 内容运营 · 短视频创作者</title>
<style>
  :root {
    --bg: #fff9f5;
    --bg-card: #ffffff;
    --bg-soft: #fff0e6;
    --accent: #ff6b6b;
    --accent-2: #ff8e53;
    --accent-3: #ffa45c;
    --gradient: linear-gradient(135deg, #ff6b6b, #ff8e53, #ffa45c);
    --gradient-soft: linear-gradient(135deg, #fff0f0, #fff5ec);
    --text: #2d1b2e;
    --text-secondary: #6b5560;
    --text-muted: #a89999;
    --border: rgba(255,107,107,0.12);
    --radius: 20px;
    --shadow: 0 4px 24px rgba(255,107,107,0.08);
    --shadow-hover: 0 8px 32px rgba(255,107,107,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* 背景装饰 */
  .bg-deco { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bg-deco::before, .bg-deco::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
  }
  .bg-deco::before { width: 500px; height: 500px; background: #ffb088; top: -100px; right: -100px; }
  .bg-deco::after { width: 400px; height: 400px; background: #ff9ea0; bottom: -50px; left: -80px; }

  /* 导航 */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 14px 5%;
    display: flex; justify-content: space-between; align-items: center;
    backdrop-filter: blur(16px);
    background: rgba(255,249,245,0.85);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-size: 1.2rem; font-weight: 700; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .nav-logo span { font-size: 1.4rem; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a {
    color: var(--text-secondary); text-decoration: none;
    font-size: 0.9rem; font-weight: 500; transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--accent); }

  /* Hero */
  .hero {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    padding: 100px 5% 40px;
  }
  .hero-avatar {
    position: relative;
    width: 160px; height: 160px;
    margin-bottom: 32px;
    animation: bounceIn 0.8s ease;
  }
  .hero-avatar svg { display: block; width: 100%; height: 100%; }
  .hero-avatar .blob-glow {
    position: absolute; inset: -20px;
    background: radial-gradient(circle at 50% 50%, rgba(255,142,83,0.25), transparent 60%);
    filter: blur(12px);
    z-index: -1;
    animation: breathe 4s ease-in-out infinite;
  }
  .hero-avatar .float-dot {
    position: absolute; border-radius: 50%;
    pointer-events: none;
  }
  .hero-avatar .float-dot.d1 {
    width: 10px; height: 10px; background: #ff6b6b;
    top: 8%; right: 2%;
    animation: floatY 3s ease-in-out infinite;
  }
  .hero-avatar .float-dot.d2 {
    width: 7px; height: 7px; background: #ffa45c;
    bottom: 12%; left: -2%;
    animation: floatY 2.5s ease-in-out infinite 0.5s;
  }
  .hero-avatar .float-dot.d3 {
    width: 5px; height: 5px; background: #ff8e53;
    top: 40%; right: -4%;
    animation: floatY 3.5s ease-in-out infinite 1s;
  }
  @keyframes breathe { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 18px; border-radius: 100px;
    background: var(--bg-soft); border: 1px solid var(--border);
    font-size: 0.85rem; color: var(--accent);
    margin-bottom: 20px;
    animation: fadeInDown 0.8s ease;
  }
  .hero-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease infinite;
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800;
    line-height: 1.2; margin-bottom: 20px;
    animation: fadeInUp 0.8s ease 0.2s both;
  }
  .hero h1 .gradient-text {
    background: var(--gradient);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-subtitle {
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--text-secondary); max-width: 560px;
    margin-bottom: 36px;
    animation: fadeInUp 0.8s ease 0.4s both;
  }
  .hero-buttons {
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    animation: fadeInUp 0.8s ease 0.6s both;
  }
  .btn {
    padding: 12px 28px; border-radius: 100px;
    font-size: 0.92rem; font-weight: 600; text-decoration: none;
    cursor: pointer; transition: all 0.3s; border: none;
  }
  .btn-primary {
    background: var(--gradient); color: white;
    box-shadow: 0 4px 16px rgba(255,107,107,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,107,107,0.4); }
  .btn-outline {
    background: transparent; color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--accent); background: var(--bg-soft); }

  /* 数据卡片 */
  .stats-bar {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 16px; margin-top: 48px;
    animation: fadeInUp 0.8s ease 0.8s both;
  }
  .stat-pill {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 24px; text-align: center;
    box-shadow: var(--shadow); transition: transform 0.3s;
  }
  .stat-pill:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
  .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

  /* Section 通用 */
  section { padding: 80px 5%; max-width: 1100px; margin: 0 auto; }
  .section-header { text-align: center; margin-bottom: 48px; }
  .section-tag {
    font-size: 0.8rem; color: var(--accent); text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 10px; font-weight: 600;
  }
  .section-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 700; margin-bottom: 12px; }
  .section-desc { color: var(--text-secondary); max-width: 480px; margin: 0 auto; font-size: 1rem; }

  /* 视频展示 */
  .video-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .video-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: all 0.3s;
  }
  .video-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(255,107,107,0.25);
  }
  .video-thumb {
    background: #000;
    position: relative;
    cursor: pointer;
    aspect-ratio: 9/16;
    overflow: hidden;
  }
  .video-thumb video {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .video-meta { padding: 18px 20px; }
  .video-meta h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .video-meta .views { color: var(--accent); font-size: 0.85rem; font-weight: 600; }
  .video-meta p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }

  /* 技能 */
  .skills-wrap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }
  .skill-box {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 28px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: all 0.3s;
  }
  .skill-box:hover { border-color: rgba(255,107,107,0.25); transform: translateY(-3px); }
  .skill-icon { font-size: 2rem; margin-bottom: 14px; }
  .skill-box h3 { font-size: 1.05rem; margin-bottom: 12px; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-tag {
    padding: 5px 12px; border-radius: 8px;
    background: var(--bg-soft); font-size: 0.8rem;
    color: var(--text-secondary); border: 1px solid var(--border);
  }

  /* 二维码区 */
  .qr-section {
    text-align: center;
    background: var(--gradient-soft);
    border-radius: var(--radius);
    padding: 56px 5%;
    border: 1px solid var(--border);
    margin: 0 5%; max-width: 800px;
  }
  .qr-placeholder {
    width: 200px; height: 200px;
    margin: 32px auto;
    border-radius: 20px;
    background: rgba(255,255,255,0.6);
    border: 2px dashed rgba(255,107,107,0.3);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 0.88rem; gap: 10px;
  }
  .qr-placeholder svg { width: 44px; height: 44px; opacity: 0.5; }

  /* 页脚 */
  footer {
    text-align: center; padding: 36px 5%;
    border-top: 1px solid var(--border);
    color: var(--text-muted); font-size: 0.83rem;
  }

  /* 动画 */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.5); } 60% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ===== 新增动效 ===== */

  /* 顶部滚动进度条 */
  .scroll-progress {
    position: fixed; top: 0; left: 0; height: 4px; width: 0; z-index: 300;
    background: var(--gradient);
    border-radius: 0 4px 4px 0;
    box-shadow: 0 0 12px rgba(255,107,107,0.45);
  }

  /* 导航滚动状态 */
  nav { transition: background 0.4s ease, box-shadow 0.4s ease; }
  nav.scrolled { background: rgba(255,255,255,0.92); box-shadow: 0 4px 20px rgba(255,107,107,0.08); }

  /* 背景光斑流动 */
  .bg-deco::before, .bg-deco::after { will-change: transform; }
  .bg-deco::before { animation: driftA 16s ease-in-out infinite alternate; }
  .bg-deco::after  { animation: driftB 22s ease-in-out infinite alternate; }
  @keyframes driftA {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(-140px,90px) scale(1.18); }
  }
  @keyframes driftB {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(110px,-80px) scale(1.22); }
  }

  /* 头像旋转光环 */
  .avatar-ring {
    position: absolute; inset: -10px; border-radius: 50%;
    opacity: 0.55; pointer-events: none; z-index: -1;
    background: conic-gradient(from 0deg, #ff6b6b, #ffa45c, #ff8e53, #ff6b6b);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    animation: spin 7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 渐变标题流光 */
  .hero h1 .gradient-text { background-size: 200% auto; animation: gradientFlow 5s ease-in-out infinite; }
  @keyframes gradientFlow {
    0%, 100% { background-position: 0% center; }
    50%      { background-position: 100% center; }
  }

  /* 首屏下滑提示 */
  .hero { position: relative; }
  .scroll-hint {
    position: absolute; bottom: 8px; left: 0; right: 0;
    margin: 0 auto; width: max-content;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: var(--text-muted); text-decoration: none;
    font-size: 0.75rem; letter-spacing: 3px;
    opacity: 0; animation: fadeInUp 0.8s ease 1.1s forwards;
  }
  .scroll-hint .mouse {
    width: 22px; height: 34px; border: 2px solid var(--accent);
    border-radius: 12px; opacity: 0.7; position: relative;
  }
  .scroll-hint .mouse::after {
    content: ''; position: absolute; left: 50%; top: 6px;
    width: 3px; height: 6px; border-radius: 2px; background: var(--accent);
    animation: wheel 1.6s ease-in-out infinite;
  }
  @keyframes wheel {
    0%   { opacity: 1; transform: translate(-50%, 0); }
    70%  { opacity: 0; transform: translate(-50%, 10px); }
    100% { opacity: 0; }
  }

  /* 数字滚动由 JS 触发，这里只预留字体特性 */
  .stat-num { font-variant-numeric: tabular-nums; }

  /* 视频卡片：悬停缩放 + 播放按钮 + 高光扫过 + 入场错峰 */
  .video-card { position: relative; }
  .video-card::after {
    content: ''; position: absolute; top: 0; left: -90%; width: 55%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-18deg); pointer-events: none;
    transition: left 0.8s ease;
  }
  .video-card:hover::after { left: 130%; }
  .video-thumb video { transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
  .video-card:hover .video-thumb video { transform: scale(1.07); }
  .video-thumb::before, .video-thumb::after {
    content: ''; position: absolute; pointer-events: none;
    opacity: 0; transition: opacity 0.35s ease;
  }
  .video-card:hover .video-thumb::before,
  .video-card:hover .video-thumb::after { opacity: 1; }
  .video-thumb::before {
    width: 58px; height: 58px; left: 50%; top: 50%;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 2;
  }
  .video-thumb::after {
    left: calc(50% + 3px); top: 50%; transform: translate(-50%, -50%);
    border-left: 18px solid var(--accent);
    border-top: 11px solid transparent; border-bottom: 11px solid transparent;
    z-index: 3;
  }
  .video-grid .reveal { transition-delay: calc(var(--i, 0) * 90ms); }

  /* 尊重系统「减弱动态效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    html { scroll-behavior: auto; }
  }

  @media (max-width: 768px) {
    .nav-links { display: none; }
    section { padding: 56px 5%; }
    .stats-bar { gap: 10px; }
    .stat-pill { padding: 12px 18px; }
    .video-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 滚动进度条 + 导航状态 */
  const nav = document.querySelector('nav');
  const progressBar = document.getElementById('scrollProgress');
  function onScroll() {
    const st = window.scrollY || document.documentElement.scrollTop;
    nav.classList.toggle('scrolled', st > 10);
    const max = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (max > 0 ? (st / max) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* 入场滚动动画（错峰延迟由 --i 控制） */
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

  /* 数据卡片数字滚动（一次触发，尊重减弱动态偏好） */
  function animateNumber(el) {
    const text = el.textContent.trim();
    const match = text.match(/([\d.]+)\s*(.*)/);
    if (!match) return;
    const target = parseFloat(match[1]);
    const suffix = match[2];
    const decimals = (String(match[1]).split('.')[1] || '').length;
    if (prefersReduced) return;
    const duration = 1400;
    const start = performance.now();
    function frame(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(decimals) + suffix;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  const numObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        animateNumber(entry.target);
        numObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('.stat-num').forEach(el => numObserver.observe(el));
</script>

</body>
